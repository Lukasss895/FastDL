<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOCR Server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .motd-card {
            background: #161922;
            border: 1px solid #2a2e3d;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #ff6600;
            font-size: 26px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #a0a6b8;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .rules-box {
            background: #1f2330;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 13px;
            color: #d0d5e2;
        }
        .rules-box ul {
            padding-left: 20px;
        }
        .rules-box li {
            margin-bottom: 6px;
        }
        .btn {
            display: inline-block;
            background: #ff6600;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #e55c00;
        }
    </style>
</head>
<body>

    <div class="motd-card">
        <h1>GOCR CS:GO Server</h1>
        <p>Welcome to our server! Enjoy the server, custom maps and community.</p>
        
        <div class="rules-box">
            <strong>Pravidlá servera:</strong>
            <ul>
                <li>Don´t Cheating, Scripts for bunnyhop etc.</li>
                <li>Don´t be toxic and don´t swear players if he´s little bit worse.</li>
                <li>Please Respect Admin and Rules.</li>
                <li>Have Fun :)<li>
            </ul>
        </div>

        <a href="https://discord.gg/h5FAqxAJR5" target="_blank" class="btn">Join on my Discord</a>
    </div>

</body>
</html>
